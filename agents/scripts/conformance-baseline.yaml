# Golden conformance baseline — independently-authored expected outcomes for the
# published policy versions. This file is NOT generated from the action specs; it
# is the separate line of defense that catches a weakening edit even when the
# edited spec is internally consistent and its generated output matches.
#
# `model_hash` is a semantic fingerprint (sha256 of the normalized bundle model),
# so comment/whitespace/key-order changes do not move it — only a behavioral
# change does. Updating any expected outcome requires the SAME authorization as
# publishing a new policy version: edit the value AND add an `audit_log` entry
# naming the new version, reviewer, rationale, and affected fixtures.
#
# Enforced by: agents/scripts/contract-conformance.py
