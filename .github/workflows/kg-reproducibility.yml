# Knowledge-graph reproducibility gate adopted with F0001's G7 remediation.
#
# Proves that compiled projections and fenced tracker regions equal their authored shards,
# shard schemas remain valid, and generated-file git policy has not drifted.
name: kg-reproducibility

# `main` is included deliberately: admin/squash merges can land without a PR run,
# and shard-vs-generated drift on main is exactly what this gate exists to catch.
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install pyyaml jsonschema
      - name: Reproducibility and git-policy check
        run: python3 scripts/kg/validate.py --check-reproducible
